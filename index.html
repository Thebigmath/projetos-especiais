<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Premium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #1a3a5c 0%, #0b1626 45%, #050a12 100%);
    color: #eaf2fb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .35;
    pointer-events: none;
  }
  .glow-a { width: 500px; height: 500px; background: #1f6feb; top: -150px; left: -120px; animation: float 12s ease-in-out infinite; }
  .glow-b { width: 420px; height: 420px; background: #12b886; bottom: -140px; right: -100px; animation: float 16s ease-in-out infinite reverse; }

  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.15); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 48px 40px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    text-align: center;
    z-index: 2;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .logo-badge {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #1f6feb, #12b886);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px;
    box-shadow: 0 8px 24px rgba(31,111,235,.45);
  }
  .logo-text {
    font-size: 22px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, #eaf2fb, #9dc1ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .spinner {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.15);
    border-top-color: #1f6feb;
    margin: 28px auto 24px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-title {
    font-size: 15px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #12b886;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .main-text {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .bar {
    height: 6px;
    width: 220px;
    margin: 26px auto 30px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #1f6feb, #12b886);
    animation: progress 2.2s ease-in-out infinite;
  }
  @keyframes progress {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }

  .hint {
    font-size: 13px;
    color: rgba(234,242,251,.55);
    letter-spacing: .5px;
  }

  .footer {
    margin-top: 30px;
    font-size: 11.5px;
    color: rgba(234,242,251,.35);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="card">

  <div class="logo">
    <div class="logo-badge">B</div>
    <div class="logo-text">BANCO PREMIUM</div>
  </div>

  <div class="spinner"></div>

  <div class="status-title">Status do Sistema</div>

  <div class="main-text">EM FASE DE DESENVOLVIMENTO</div>

  <div class="bar"><div class="bar-fill"></div></div>

  <div class="hint">Em breve novas funcionalidades estarão disponíveis.</div>

  <div class="footer">&copy; 2026 Banco Premium &mdash; Todos os direitos reservados</div>

</div>

</body>
</html>
