<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Premium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #1a3a5c 0%, #0b1626 45%, #050a12 100%);
    color: #eaf2fb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .35;
    pointer-events: none;
    z-index: 0;
  }
  .glow-a { width: 500px; height: 500px; background: #1f6feb; top: -150px; left: -120px; animation: float 12s ease-in-out infinite; }
  .glow-b { width: 420px; height: 420px; background: #12b886; bottom: -140px; right: -100px; animation: float 16s ease-in-out infinite reverse; }

  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.15); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 620px;
    margin: 30px auto;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 40px 40px 44px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    text-align: center;
    z-index: 2;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .logo-badge {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #1f6feb, #12b886);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px;
    box-shadow: 0 8px 24px rgba(31,111,235,.45);
  }
  .logo-text {
    font-size: 22px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, #eaf2fb, #9dc1ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .sub {
    font-size: 13px;
    color: rgba(234,242,251,.55);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .links {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 8px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12);
    text-decoration: none;
    color: #eaf2fb;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    text-align: left;
  }
  .link-card:hover {
    transform: translateY(-3px);
    border-color: rgba(31,111,235,.7);
    box-shadow: 0 12px 30px rgba(31,111,235,.28);
  }

  .link-icon {
    width: 48px; height: 48px;
    flex-shrink: 0;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
  }
  .icon-drive { background: linear-gradient(135deg, #34a853, #188038); }
  .icon-html { background: linear-gradient(135deg, #f16529, #e44d26); }
  .icon-py { background: linear-gradient(135deg, #3776ab, #ffd43b); color: #1e3a5f; }

  .link-info { flex: 1; }
  .link-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .link-desc {
    font-size: 12.5px;
    color: rgba(234,242,251,.6);
  }

  .link-arrow {
    font-size: 20px;
    color: rgba(234,242,251,.45);
    transition: transform .18s ease, color .18s ease;
  }
  .link-card:hover .link-arrow {
    transform: translateX(4px);
    color: #9dc1ff;
  }

  .footer {
    margin-top: 26px;
    font-size: 11.5px;
    color: rgba(234,242,251,.35);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="card">

  <div class="logo">
    <div class="logo-badge">B</div>
    <div class="logo-text">BANCO PREMIUM</div>
  </div>

  <div class="sub">Inclusos no Crachá Engineer</div>

  <div class="links">

    <a class="link-card" href="https://drive.google.com/drive/folders/1pEVfZYONCxzb1RhwEdauRVSmJnTBOBkk?usp=drive_link" target="_blank" rel="noopener">
      <div class="link-icon icon-drive">D</div>
      <div class="link-info">
        <div class="link-title">Spider Project</div>
        <div class="link-desc">Acessar pasta no Google Drive</div>
      </div>
      <div class="link-arrow">&#8594;</div>
    </a>

    <a class="link-card" href="https://onecompiler.com/html" target="_blank" rel="noopener">
      <div class="link-icon icon-html">&lt;/&gt;</div>
      <div class="link-info">
        <div class="link-title">Ferramenta HTML</div>
        <div class="link-desc">OneCompiler &mdash; editor de HTML online</div>
      </div>
      <div class="link-arrow">&#8594;</div>
    </a>

    <a class="link-card" href="https://pythononline.net/" target="_blank" rel="noopener">
      <div class="link-icon icon-py">Py</div>
      <div class="link-info">
        <div class="link-title">Ferramenta Python</div>
        <div class="link-desc">Python Online &mdash; execute código Python</div>
      </div>
      <div class="link-arrow">&#8594;</div>
    </a>

  </div>

  <div class="footer">&copy; 2026 Banco Premium &mdash; Todos os direitos reservados</div>

</div>

</body>
</html>
